<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FabricsBossArena">
  <!-- Warp thread (gold), bottom-left to top-right -->
  <path
    d="M16 84 C 34 66, 42 58, 50 50 C 58 42, 66 34, 84 16"
    stroke="#C9974A"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Weft thread (deep brown, tuned for typical light browser-tab backgrounds) -->
  <path
    d="M16 16 C 34 34, 42 42, 50 50 C 58 58, 66 66, 84 84"
    stroke="#2C1810"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Frayed thread ends -->
  <g stroke-linecap="round" stroke-width="1.5" opacity="0.75">
    <line x1="16" y1="84" x2="7.543" y2="80.922" stroke="#C9974A" />
    <line x1="16" y1="84" x2="10.215" y2="77.106" stroke="#C9974A" />
    <line x1="16" y1="84" x2="14.438" y2="75.137" stroke="#C9974A" />

    <line x1="84" y1="16" x2="92.457" y2="19.078" stroke="#C9974A" />
    <line x1="84" y1="16" x2="89.785" y2="22.894" stroke="#C9974A" />
    <line x1="84" y1="16" x2="85.562" y2="24.863" stroke="#C9974A" />

    <line x1="16" y1="16" x2="7.137" y2="14.438" stroke="#2C1810" />
    <line x1="16" y1="16" x2="9.106" y2="10.215" stroke="#2C1810" />
    <line x1="16" y1="16" x2="12.922" y2="7.543" stroke="#2C1810" />

    <line x1="84" y1="84" x2="92.863" y2="85.562" stroke="#2C1810" />
    <line x1="84" y1="84" x2="90.894" y2="89.785" stroke="#2C1810" />
    <line x1="84" y1="84" x2="87.078" y2="92.457" stroke="#2C1810" />
  </g>

  <!-- Interlace knot where the threads cross -->
  <circle cx="50" cy="50" r="5.5" fill="#2C1810" stroke="#C9974A" stroke-width="2" />
</svg>

<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FabricsBossArena">
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#2C1810" />

  <!-- Folded fabric-swatch corner -->
  <polygon points="78,100 100,100 100,78" fill="#170D07" />
  <polygon points="82,100 100,100 100,82" fill="#C9974A" />
  <line x1="82" y1="100" x2="100" y2="82" stroke="#8A6A3A" stroke-width="1.2" />

  <!-- Stitched hem accent -->
  <path
    d="M18 74 Q 48 83 74 74"
    stroke="#C9974A"
    stroke-width="2"
    stroke-dasharray="2 5"
